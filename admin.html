<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | أكاديمية الديسوقي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Cairo,sans-serif}.wrap{max-width:1200px;margin:auto;padding:25px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:24px;margin:0}.sub{color:#718096;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 15px;font:700 13px Cairo;cursor:pointer;background:#ff7200;color:white}.btn.secondary{background:#e9edf3;color:#172033}.btn.danger{background:#c9362b}.filters{display:flex;gap:10px;flex-wrap:wrap;background:white;padding:14px;border:1px solid #e4e8ee;border-radius:15px;margin-bottom:16px}.filters input,.filters select{height:42px;border:1px solid #dce2ea;border-radius:9px;padding:0 12px;font:13px Cairo;background:white}.filters input{flex:1;min-width:190px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:white;border:1px solid #e4e8ee;border-radius:13px;padding:12px 16px;min-width:125px}.stat span{display:block;font-size:12px;color:#718096}.stat strong{font-size:23px}.table-wrap{background:white;border:1px solid #e4e8ee;border-radius:15px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:right;padding:13px 12px;border-bottom:1px solid #edf0f4;font-size:13px;vertical-align:middle}th{background:#fafbfc;color:#596579;font-weight:800}td small{display:block;color:#718096}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:11px;background:#fff2df;color:#9a4d00}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.actions select{max-width:125px;height:34px;border:1px solid #dce2ea;border-radius:8px;font:12px Cairo}.actions .btn{padding:6px 9px;font-size:11px}.photo{width:46px;height:46px;border-radius:50%;object-fit:cover}.empty,.message{padding:25px;text-align:center;color:#718096}.error{color:#a52b20}.hidden{display:none}@media(max-width:600px){h1{font-size:20px}.wrap{padding:16px 10px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>طلبات أكاديمية الديسوقي</h1><div class="sub" id="who">جارٍ التحقق من جلسة الدخول...</div></div><div><button class="btn secondary" id="refresh">تحديث</button> <button class="btn danger" id="logout">تسجيل الخروج</button></div></header><section class="stats"><div class="stat"><span>كل الطلبات المعروضة</span><strong id="total">—</strong></div><div class="stat"><span>طلبات جديدة</span><strong id="newCount">—</strong></div><div class="stat"><span>قيد المراجعة</span><strong id="reviewCount">—</strong></div><div class="stat"><span>مقبول</span><strong id="acceptedCount">—</strong></div></section><section class="filters"><input id="search" placeholder="ابحث بالاسم أو رقم الهاتف"><select id="status"><option value="all">كل الحالات</option><option value="new">جديد</option><option value="reviewing">قيد المراجعة</option><option value="accepted">مقبول</option><option value="rejected">مرفوض</option></select><button class="btn" id="apply">بحث / تصفية</button></section><div id="message" class="message">جارٍ تحميل الطلبات...</div><div class="table-wrap"><table><thead><tr><th>الصورة</th><th>اسم اللاعب</th><th>الهاتف</th><th>الفرع</th><th>العمر</th><th>النوع</th><th>تاريخ الطلب</th><th>الحالة والإجراءات</th></tr></thead><tbody id="orders"></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-config.js"></script><script>
const cfg=window.ACADEMY_CONFIG||{},msg=document.getElementById('message'),tbody=document.getElementById('orders');let sb,session;const labels={new:'جديد',reviewing:'قيد المراجعة',accepted:'مقبول',rejected:'مرفوض'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){if(!cfg.url||!cfg.anonKey){msg.textContent='أكمل إعداد public/admin-config.js.';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data}=await sb.auth.getSession();session=data.session;if(!session){location.href='/login.html';return}const check=await api('/api/admin-login');if(!check.ok){await sb.auth.signOut();location.href='/login.html';return}document.getElementById('who').textContent='مسجل الدخول: '+check.email;await load()}
async function api(url,options={}){const {data}=await sb.auth.getSession();if(!data.session)throw new Error('انتهت الجلسة. سجّل الدخول مرة أخرى.');const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token,...(options.headers||{})}});const out=await r.json();if(!r.ok)throw new Error(out.error||'حدث خطأ');return out}
async function load(){msg.className='message';msg.textContent='جارٍ تحميل الطلبات...';tbody.innerHTML='';try{const p=new URLSearchParams({status:document.getElementById('status').value,q:document.getElementById('search').value.trim()});const out=await api('/api/orders?'+p.toString());const rows=out.orders||[];document.getElementById('total').textContent=rows.length;document.getElementById('newCount').textContent=rows.filter(x=>x.status==='new').length;document.getElementById('reviewCount').textContent=rows.filter(x=>x.status==='reviewing').length;document.getElementById('acceptedCount').textContent=rows.filter(x=>x.status==='accepted').length;if(!rows.length){msg.textContent='لا توجد طلبات مطابقة.';return}msg.textContent='';for(const o of rows){const tr=document.createElement('tr');tr.innerHTML=`<td>${o.photo_url?`<a href="${esc(o.photo_url)}" target="_blank" rel="noopener"><img class="photo" src="${esc(o.photo_url)}" alt="صورة اللاعب"></a>`:'—'}</td><td><strong>${esc(o.player_name)}</strong><small>${esc(o.id)}</small></td><td><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></td><td>${esc(o.branch)}</td><td>${esc(o.age_group)}</td><td>${esc(o.gender==='not_specified'?'غير محدد':o.gender)}</td><td>${esc(new Date(o.created_at).toLocaleString('ar-EG'))}</td><td><div class="actions"><select aria-label="حالة الطلب" data-status="${esc(o.id)}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" data-save="${esc(o.id)}">حفظ</button><button class="btn danger" data-delete="${esc(o.id)}">حذف</button></div></td>`;tbody.appendChild(tr)}}catch(e){msg.className='message error';msg.textContent=e.message}}
tbody.addEventListener('click',async e=>{const save=e.target.closest('[data-save]'),del=e.target.closest('[data-delete]');try{if(save){const id=save.dataset.save,status=tbody.querySelector(`[data-status="${CSS.escape(id)}"]`).value;save.disabled=true;await api('/api/orders',{method:'PATCH',body:JSON.stringify({id,status})});await load()}else if(del){const id=del.dataset.delete;if(!confirm('هل أنت متأكد من حذف هذا الطلب؟'))return;del.disabled=true;await api('/api/orders',{method:'DELETE',body:JSON.stringify({id})});await load()}}catch(err){alert(err.message)} });document.getElementById('refresh').onclick=load;document.getElementById('apply').onclick=load;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.getElementById('logout').onclick=async()=>{if(sb)await sb.auth.signOut();location.href='/login.html'};init();
</script></body></html>
