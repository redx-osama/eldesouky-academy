<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة | أكاديمية الديسوقي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;color:#172033;font-family:Cairo,sans-serif;padding:20px}.card{width:100%;max-width:430px;background:white;border:1px solid #e4e8ee;border-radius:22px;padding:30px;box-shadow:0 20px 60px #10182812}h1{font-size:23px;margin:0 0 6px}p{color:#718096;font-size:13px;margin:0 0 22px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;height:48px;border:1px solid #dce2ea;border-radius:11px;padding:0 12px;font:inherit}button{margin-top:18px;width:100%;height:49px;border:0;border-radius:11px;background:#ff7200;color:white;font:700 15px Cairo;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:12px;font-size:13px;color:#a52b20}.hint{margin-top:16px;font-size:12px;color:#718096;line-height:1.8}</style></head><body><main class="card"><h1>لوحة إدارة أكاديمية الديسوقي</h1><p>سجّل الدخول بحساب الأدمن المصرّح به.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">تسجيل الدخول</button><div id="msg" class="msg" role="alert"></div></form><div class="hint">يجب إنشاء مستخدم من Supabase Authentication وإضافة بريده في متغير ADMIN_EMAILS داخل Vercel.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin-config.js"></script><script>
const cfg=window.ACADEMY_CONFIG||{};const msg=document.getElementById('msg'),btn=document.getElementById('submit');if(!cfg.url||!cfg.anonKey){msg.textContent='أكمل إعداد public/admin-config.js أولاً.';btn.disabled=true;}else{const sb=window.supabase.createClient(cfg.url,cfg.anonKey);document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;msg.textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const check=await fetch('/api/admin-login',{headers:{Authorization:'Bearer '+data.session.access_token}});const result=await check.json();if(!check.ok)throw new Error(result.error||'غير مصرح');location.href='/admin.html';}catch(err){await sb.auth.signOut();msg.textContent=err.message||'تعذر تسجيل الدخول.';}finally{btn.disabled=false;}});}
</script></body></html>
