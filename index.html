<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية الدسوقي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--orange:#ff7200;--orange-dark:#ed5d00;--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#718096;--border:#e4e8ee;--input:#fbfcfe;--notice:#fff8f1;--notice-border:#ffe2ca;--shadow:0 20px 60px #10182814,0 4px 15px #1018280a}body.dark{--bg:#0b1018;--card:#141b26;--text:#f4f7fb;--muted:#9da8b8;--border:#273241;--input:#101722;--notice:#21180f;--notice-border:#4a3020;--shadow:0 20px 60px #0006,0 4px 15px #0003}body{font-family:Cairo,sans-serif;background:radial-gradient(circle at top right,#ff720014,transparent 35%),var(--bg);min-height:100vh;color:var(--text);transition:.3s}.top-controls{position:fixed;top:18px;left:18px;display:flex;gap:8px;z-index:5}.control-box{height:42px;display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:0 5px 20px #0000000d}.lang-btn,.theme-btn{border:0;border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;cursor:pointer}.lang-btn{height:34px;padding:0 12px;font-size:12px;font-weight:700}.lang-btn.active{background:var(--orange);color:white}.theme-btn{width:40px;height:34px;font-size:18px;color:var(--text)}.page{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:78px 15px 35px}.form-card{width:100%;max-width:620px;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:35px;box-shadow:var(--shadow)}.header{text-align:center;margin-bottom:28px}
.logo{width: 55px;height: 55px;margin: 0 auto 15px;display: block;}
.logo-img{width: 100%;height: 100%;object-fit: contain;border-radius: 14px;box-shadow: 0 6px 18px rgba(255, 114, 0, 0.3);}
.header h1{font-size:25px;font-weight:800;margin-bottom:6px}.header p{font-size:14px;color:var(--muted);line-height:1.8}.header strong{color:var(--orange)}.photo-section{display:flex;flex-direction:column;align-items:center;margin-bottom:25px}.photo-box{width:105px;height:105px;border-radius:50%;background:var(--input);border:5px solid var(--card);box-shadow:0 0 0 1px var(--border),0 10px 25px #00000012;position:relative;display:grid;place-items:center;overflow:hidden}.photo-box img{width:100%;height:100%;object-fit:cover;display:none}.photo-placeholder{color:#9aa4b2;font-size:30px}.camera-btn{position:absolute;bottom:0;left:3px;width:34px;height:34px;border-radius:50%;border:3px solid var(--card);background:var(--orange);color:white;display:grid;place-items:center;cursor:pointer}.photo-text{margin-top:10px;text-align:center}.photo-text strong{display:block;font-size:15px}.photo-text span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.form-group{margin-bottom:19px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}.required{color:#ff5d35}input,select{width:100%;height:53px;border:1px solid var(--border);background:var(--input);border-radius:13px;padding:0 16px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:.2s}input:focus,select:focus{background:var(--card);border-color:var(--orange);box-shadow:0 0 0 4px #ff72001a}select{cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.submit-btn{width:100%;min-height:56px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff8500,#ff5c00);color:white;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 25px #ff660040;transition:.25s;margin-top:7px}.submit-btn:hover{transform:translateY(-2px)}.submit-btn:disabled{opacity:.65;cursor:wait;transform:none}.notice{margin-top:18px;padding:13px 15px;background:var(--notice);border:1px solid var(--notice-border);border-radius:12px;text-align:center;font-size:12px;line-height:1.8;color:var(--muted)}.feedback{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.feedback.success{display:block;background:#e9f9ef;color:#176b38}.feedback.error{display:block;background:#fff0ee;color:#a52b20}@media(max-width:600px){.top-controls{top:12px;left:12px}.page{padding:70px 12px 20px;align-items:flex-start}.form-card{padding:25px 18px;border-radius:21px}.header h1{font-size:21px}.header p{font-size:13px}.row{grid-template-columns:1fr;gap:0}}
</style></head>
<body>
<div class="top-controls"><div class="control-box"><button class="lang-btn active" id="arBtn" type="button" onclick="changeLanguage('ar')">العربية</button><button class="lang-btn" id="enBtn" type="button" onclick="changeLanguage('en')">English</button></div><div class="control-box"><button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()" title="تغيير المظهر">🌙</button></div></div>
<main class="page"><section class="form-card">

<header class="header">
  <div class="logo">
    <img src="https://i.postimg.cc/Kvg9ng4B/Chat-GPT-Image-9-aktwbr-2026-04-12-13-m-(1).png" alt="Logo" class="logo-img">
  </div>
  <h1 data-ar="أكاديمية الديسوقي" data-en="ElDesouky Academy">أكاديمية الديسوقي</h1>
  <p><span data-ar="أدخل بياناتك للتقدم بطلب " data-en="Enter your information to apply for ">أدخل بياناتك للتقدم بطلب </span><strong data-ar="الانضمام" data-en="membership">الانضمام</strong><span data-ar=" إلى الأكاديمية" data-en=" to the academy"> إلى الأكاديمية</span></p>
</header>

<div class="photo-section"><div class="photo-box"><div class="photo-placeholder" id="photoPlaceholder">👤</div><img id="preview" alt="معاينة الصورة"><label for="photo" class="camera-btn" title="إضافة صورة">📷</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp" hidden></div><div class="photo-text"><strong data-ar="الصورة الشخصية" data-en="Profile Photo">الصورة الشخصية</strong><span data-ar="اختياري - صورة واضحة للوجه تساعد المدربين على التعرف عليك" data-en="Optional - A clear face photo helps coaches identify you">اختياري - صورة واضحة للوجه تساعد المدربين على التعرف عليك</span></div></div>
<form id="academyForm"><div class="form-group"><label for="playerName"><span data-ar="اسم اللاعب" data-en="Player Name">اسم اللاعب</span> <span class="required">*</span></label><input id="playerName" name="player_name" type="text" required minlength="2" maxlength="100" placeholder="أدخل اسم اللاعب" data-placeholder-ar="أدخل اسم اللاعب" data-placeholder-en="Enter player name"></div>
<div class="form-group"><label for="phone"><span data-ar="رقم الهاتف" data-en="Phone Number">رقم الهاتف</span> <span class="required">*</span></label><input id="phone" name="phone" type="tel" maxlength="20" required inputmode="tel" placeholder="01001234567" data-placeholder-ar="01001234567" data-placeholder-en="Enter phone number"></div>
<div class="row"><div class="form-group"><label for="branch"><span data-ar="الفرع" data-en="Branch">الفرع</span> <span class="required">*</span></label><select id="branch" name="branch" required><option value="" selected disabled data-ar="اختر الفرع" data-en="Select branch">اختر الفرع</option><option value="فرع كفر الشيخ - مدرسة هدى شعراوي" data-ar="فرع كفر الشيخ - مدرسة هدى شعراوي" data-en="Kafr El-Sheikh - Hoda Shaarawy School">فرع كفر الشيخ - مدرسة هدى شعراوي</option><option value="فرع جمصة" data-ar="فرع جمصة" data-en="Gamasa Branch">فرع جمصة</option></select></div>
<div class="form-group"><label for="ageGroup"><span data-ar="الفئة العمرية" data-en="Age Group">الفئة العمرية</span> <span class="required">*</span></label><select id="ageGroup" name="age_group" required><option value="" selected disabled data-ar="اختر الفئة العمرية" data-en="Select age group">اختر الفئة العمرية</option><option value="تحت 10 سنوات" data-ar="تحت 10 سنوات" data-en="Under 10 years">تحت 10 سنوات</option><option value="10 - 12 سنة" data-ar="10 - 12 سنة" data-en="10–12 years">10 - 12 سنة</option><option value="13 - 15 سنة" data-ar="13 - 15 سنة" data-en="13–15 years">13 - 15 سنة</option><option value="16 - 18 سنة" data-ar="16 - 18 سنة" data-en="16–18 years">16 - 18 سنة</option><option value="فوق 18 سنة" data-ar="فوق 18 سنة" data-en="Over 18 years">فوق 18 سنة</option></select></div></div>
<div class="form-group"><label for="gender" data-ar="النوع" data-en="Gender">النوع</label><select id="gender" name="gender"><option value="not_specified" selected data-ar="لم يتم التحديد" data-en="Prefer not to say">لم يتم التحديد</option><option value="ذكر" data-ar="ذكر" data-en="Male">ذكر</option><option value="أنثى" data-ar="أنثى" data-en="Female">أنثى</option></select></div>
<button type="submit" class="submit-btn" data-ar="إرسال الطلب" data-en="Submit Application">إرسال الطلب</button><div id="feedback" class="feedback" role="status" aria-live="polite"></div></form>
<div class="notice" data-ar="سيتم إرسال بياناتك إلى أكاديمية الديسوقي فقط، وتتم مراجعة طلبك قبل قبولك كلاعب." data-en="Your information will only be sent to ElDesouky Academy. Your application will be reviewed before approval.">سيتم إرسال بياناتك إلى أكاديمية الديسوقي فقط، وتتم مراجعة طلبك قبل قبولك كلاعب.</div></section></main>

<script>
const TELEGRAM_TOKEN = '8635795405:AAEZyf6mtqY5B0MauXtk4T9O7CKmYmBN0pI';
const TELEGRAM_CHAT_ID = '5050384577';

function changeLanguage(lang){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-ar][data-en]').forEach(el=>{
    if(el.matches('input')) return;
    if(el.tagName==='OPTION'){ el.textContent=el.getAttribute('data-'+lang); return; }
    el.textContent=el.getAttribute('data-'+lang);
  });
  document.querySelectorAll('[data-placeholder-ar]').forEach(el=>el.placeholder=el.getAttribute('data-placeholder-'+lang));
  document.getElementById('arBtn').classList.toggle('active',lang==='ar');
  document.getElementById('enBtn').classList.toggle('active',lang==='en');
  localStorage.setItem('academyLanguage',lang);
}

function toggleTheme(){
  document.body.classList.toggle('dark');
  const dark=document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';
  localStorage.setItem('academyTheme',dark?'dark':'light');
}

changeLanguage(localStorage.getItem('academyLanguage')||'ar');
if(localStorage.getItem('academyTheme')==='dark'){
  document.body.classList.add('dark');
  document.getElementById('themeBtn').textContent='☀️';
}

const photoInput=document.getElementById('photo'),
      preview=document.getElementById('preview'),
      placeholder=document.getElementById('photoPlaceholder');
let photoFile = null;

photoInput.addEventListener('change', function(){
  const file = this.files?.[0];
  if(!file) return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){
    this.value='';
    alert(document.documentElement.lang==='ar'?'اختر صورة JPG أو PNG أو WEBP.':'Please choose a JPG, PNG, or WEBP image.');
    return;
  }
  if(file.size > 2*1024*1024){
    this.value='';
    alert(document.documentElement.lang==='ar'?'حجم الصورة يجب ألا يتجاوز 2 ميجابايت.':'Image must be 2 MB or smaller.');
    return;
  }
  photoFile = file;
  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('academyForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget,
        btn = form.querySelector('.submit-btn'),
        feedback = document.getElementById('feedback'),
        lang = document.documentElement.lang;

  btn.disabled = true;
  btn.textContent = lang==='ar'?'جارٍ إرسال الطلب...':'Submitting...';
  feedback.className = 'feedback';
  feedback.textContent = '';

  const caption = `🎯 *طلب انضمام جديد - أكاديمية الديسوقي*\n\n` +
                  `👤 *اسم اللاعب:* ${form.player_name.value.trim()}\n` +
                  `📞 *رقم الهاتف:* ${form.phone.value.trim()}\n` +
                  `🏫 *الفرع:* ${form.branch.value}\n` +
                  `🎂 *الفئة العمرية:* ${form.age_group.value}\n` +
                  `⚧ *النوع:* ${form.gender.value}`;

  try {
    let url, formData = new FormData();
    formData.append('chat_id', TELEGRAM_CHAT_ID);

    if (photoFile) {
      url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`;
      formData.append('photo', photoFile);
      formData.append('caption', caption);
      formData.append('parse_mode', 'Markdown');
    } else {
      url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
      formData.append('text', caption);
      formData.append('parse_mode', 'Markdown');
    }

    const response = await fetch(url, { method: 'POST', body: formData });
    const result = await response.json();

    if (!result.ok) throw new Error(result.description || 'Request failed');

    feedback.className = 'feedback success';
    feedback.textContent = lang==='ar'?'تم استلام طلبك بنجاح، وستتم مراجعته من إدارة الأكاديمية. ✅':'Your application was received successfully. The academy team will review it. ✅';
    
    form.reset();
    photoFile = null;
    preview.removeAttribute('src');
    preview.style.display = 'none';
    placeholder.style.display = 'block';

  } catch (err) {
    feedback.className = 'feedback error';
    feedback.textContent = (lang==='ar'?'تعذر إرسال الطلب: ':'Could not submit application: ') + (err.message || '');
  } finally {
    btn.disabled = false;
    btn.textContent = btn.getAttribute('data-' + lang);
  }
});
</script>
</body>
</html>
